@if(artistProfile.value()){
<div class="container">
  <div class="header">
    <div class="img">
      <img [src]="artistProfile.value()?.image" alt="" />
    </div>

    <div class="info">
      <div class="name">
        <h1>{{ artistProfile.value()?.name }}</h1>
      </div>

      <div class="listeners-count">
        <lucide-icon name="user-round"></lucide-icon>
        <p>{{ artistProfile.value()?.fanCount }} listeners per month</p>
      </div>
    </div>
  </div>

  <div class="popular-songs">
    <div class="sector-header">
      <h1>Popular Songs:</h1>
    </div>
    <div class="songs">
      <app-track-list [tracks]="artistProfile.value()?.topSongs"></app-track-list>
    </div>
  </div>

  <div class="albums">
    <div class="sector-header">
      <h1>Popular albums:</h1>
    </div>
    <div>
      <app-albums-list [albums]="artistProfile.value()?.topAlbums"></app-albums-list>
    </div>
  </div>

  @if(artistProfile.value()?.similarArtists){

  <div class="similar-artists">
    <app-similar-artists [artists]="artistProfile.value()?.similarArtists"></app-similar-artists>
  </div>
  }
</div>
}
