@if (artistProfile.value()) {
  <div class="container">
    <app-entity-header-component
      [typeOfPage]="'Artist'"
      [image]="artistProfile.value()?.image"
      [imageForm]="'Circle'"
      [title]="artistProfile.value()?.name!"
      [description]="headerDiscriptionInfo()"
    >
    <button>eojgnr</button>
  </app-entity-header-component>

    <div class="popular-songs">
      <div class="sector-header">
        <h1>{{ 'ARTIST_PROFILE.POPULAR_SONGS' | translate }}</h1>
      </div>
      <div class="songs">
        <app-track-list [tracks]="artistProfile.value()?.topSongs!"></app-track-list>
      </div>
    </div>

    @if (topAlbums().length) {
      <div class="media">
        <div class="sector-header">
          <h1>{{ 'ARTIST_PROFILE.POPULAR_ALBUMS' | translate }}</h1>
        </div>
        <app-media-list-section
          [data]="topAlbums()"
          [imageForm]="'Square'"
        ></app-media-list-section>
      </div>
    }

    @if (similarArtists().length) {
      <div class="media">
        <h1>{{ 'ARTIST_PROFILE.SIMILAR_ARTISTS' | translate }}</h1>

        <app-media-list-section
          [data]="similarArtists()"
          [imageForm]="'Circle'"
        ></app-media-list-section>
      </div>
    }
  </div>
}
