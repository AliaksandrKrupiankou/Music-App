<div class="container">
  
  @defer (when likedTracksList.value() !== undefined) {
    
    <app-entity-header-component
      [typeOfPage]="'Playlist'"
      [image]="'https://avatars.yandex.net/get-music-user-playlist/11418140/favorit-playlist-cover.bb48fdb9b9f4/600x600'"
      [imageForm]="'Square'"
      [title]="'MyCollection'"
      [description]="headerDiscriptionData"
    >
      <app-listen-button-component [data]="likedTracksList.value()!"></app-listen-button-component> 
    </app-entity-header-component>

    <div class="list">
      <app-track-list [tracks]="likedTracksList.value()!"></app-track-list>
    </div>

  } @placeholder (minimum 500ms) {
    
    <app-entity-header-component-skeleton [imageForm]="'Square'"></app-entity-header-component-skeleton>
    
    <div class="list">
      @for (item of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track $index) {
        <app-track-row-skeleton></app-track-row-skeleton>
      }
    </div>

  }

</div>
