<div class="container">
  <div class="header">
    <div class="img">
      <img
        src="https://avatars.yandex.net/get-music-user-playlist/11418140/favorit-playlist-cover.bb48fdb9b9f4/600x600"
      />
    </div>

    <div class="right-content">
      <div class="text">
        <p>{{ 'COLLECTION.PLAYLIST' | translate }}</p>
        <h1>{{ 'COLLECTION.MY_COLLECTION' | translate }}</h1>
        <p>{{ userName }}</p>
      </div>
    </div>
  </div>
  <div class="search"></div>

  <div class="list">
    <app-track-list [tracks]="likedTracksList()"></app-track-list>
  </div>
</div>
