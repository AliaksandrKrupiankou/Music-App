
<div class="artists-list">


    <ul class="artists">
        @for(artist of artists(); track artist.id){
            <li class="artist-li">
                <div class="artist">
                    <div class="img">
                        <img [src]="artist.image" alt="">
                    </div>
                    <div class="name">
                        <p>{{artist.name}}</p>
                    </div>
                </div>
            </li>
        }
    </ul>
    
</div>
