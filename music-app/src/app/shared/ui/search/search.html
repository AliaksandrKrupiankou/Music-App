<div class="search-area">
  <div class="search">
    <div class="input-wrapper">
      <lucide-icon name="search" class="search-icon"></lucide-icon>

      <input
        type="text"
        [formControl]="searchInput"
        placeholder="{{ 'SEARCH.PLACEHOLDER' | translate }}"
      />
    </div>
  </div>

  @if(showTypes()){

  <div class="search-type">
    <button
      class="filter"
      [class.active]="typeOfSearch() === 'songs'"
      (click)="setSearchType('songs')"
    >
      {{ 'SEARCH.SONGS' | translate }}
    </button>

    <button
      class="filter"
      [class.active]="typeOfSearch() === 'artists'"
      (click)="setSearchType('artists')"
    >
      {{ 'SEARCH.ARTISTS' | translate }}
    </button>
  </div>

  }
</div>
