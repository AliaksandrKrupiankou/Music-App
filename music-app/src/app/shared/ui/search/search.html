<div class="search-area">
  <div class="search">
    <div class="input-wrapper">
      <lucide-icon name="search" class="search-icon"></lucide-icon>

      <input type="text" [formControl]="searchInput" placeholder="Search of track" />
    </div>
  </div>

  <div class="search-type">
    <button
      class="filter"
      [class.active]="typeOfSearch() === 'songs'"
      (click)="setSearchType('songs')"
    >
      Songs
    </button>

    <button
      class="filter"
      [class.active]="typeOfSearch() === 'artists'"
      (click)="setSearchType('artists')"
    >
      Artists
    </button>
  </div>
</div>
