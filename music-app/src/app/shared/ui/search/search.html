<div class="search-area">

<div class="search">
    <div class="input-wrapper">

        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
        class="lucide-search">
        <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        
        <input type="text" [formControl]="serachInput" placeholder="Search of track">

    </div>
    
    <button (click)="search()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
    </button>

</div>

<div class="search-type">
    <button class="filter" [class.active]="typeOfSearch() === 'songs'" (click)="setSearchType('songs')">
        Songs
    </button>

    <button class="filter" [class.active]="typeOfSearch() === 'artists'" (click)="setSearchType('artists')">
        Artists
    </button>
</div>
</div>
