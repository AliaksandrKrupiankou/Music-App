<div class="component">

    <ul class="list">
        @for(track of tracks(); track track.id){
            <li>
                <div class="track"></div>
                <div class="cover-img"><img [src]="track.coverUrl" alt=""></div>
                <div class="track-info">
                    <p>{{track.title}}</p>
                    <p>{{track.artist}}</p>
                </div>
                <div class="play-button">
                    <button (click)="player.toggle(track)">play</button>
                </div>
            </li>
        }
    </ul>
</div>
