<div class="component">

    <ul>
        @for(track of tracks(); track track.id){
            <li>
                <div class="track">
                <div class="cover-img"><img [src]="track.coverUrl" alt=""></div>
                <div class="track-info">
                    <p class="track-name">{{track.title}}</p>
                    <p class="artist-name">{{track.artist}}</p>
                </div>
                <div class="play-button">
                    <button (click)="playTrack(track, tracks()!)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" 
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play">
                        <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
                    </button>
                </div>
                    <div class="like">
                            <button class="like-btn-active" (click)="like.toggleLike(track)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" [class.liked]="like.isLiked(track)"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart">
                            <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                        </button>



                    </div>
                <div class="duration"><p>{{track.duration | trackDuring}} </p></div>
                </div>
            </li>
        }
    </ul>
</div>
