<div class="component">
  <ul>
    @for(track of tracks(); track track.id){
    <li>
      <app-track-row [track]="track" (playTrackId)="playTrack($event)">

      @if(actionTemplate()){
        <div buttons>
          <ng-container
          *ngTemplateOutlet="actionTemplate(); context: { $implicit: track }"
          >
          </ng-container>
        </div>
      }
      </app-track-row>
    </li>
    }
  </ul>
</div>
